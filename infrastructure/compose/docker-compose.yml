services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_local_password
      POSTGRES_DB: devops_command_center
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devops -d devops_command_center']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      DATABASE_URL: postgresql://devops:devops_local_password@postgres:5432/devops_command_center?schema=public
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  postgres-data:
